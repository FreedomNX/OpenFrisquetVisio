; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; For first installation, remove below line
; - upload_protocol = espota
; and replace IP adress with COM3
; - upload_port = 192.168.1.185


[platformio]
default_envs = heltec_wifi_lora_32_V3

[env:heltec_wifi_lora_32_V3]
board = heltec_wifi_lora_32_V3

[env:heltec_wifi_lora_32_V4]
board = heltec_wifi_lora_32_V4
; Partitionnement 16 Mo avec OTA, identique en local et dans la CI.
board_build.partitions = default_16MB.csv

[env:heltec_wifi_lora_32_V4_3]
board = heltec_wifi_lora_32_V4
board_build.partitions = default_16MB.csv
build_unflags = -DUSE_NONE_PA
build_flags = -DUSE_KCT8103L_PA

; LilyGo / TTGO LoRa32 V2.1 avec SX1276 868 MHz, premier flash par USB.
[env:ttgo_lora32_v21]
board = ttgo-lora32-v21
board_build.partitions = min_spiffs.csv
build_flags = -DBOARD_TTGO_LORA32
upload_protocol = esptool
upload_port =
upload_flags =
upload_speed = 115200
; Même socle de bibliothèques, sans les dépendances Heltec.
lib_deps =
    jgromes/RadioLib@7.8.1
    knolleary/PubSubClient@2.8
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@4.0.6
    paulstoffregen/Time@1.6.1
    bblanchon/ArduinoJson@7.4.3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
#upload_port = /dev/cu.usbserial-0001
#monitor_port = /dev/cu.usbserial-0001
upload_protocol = espota
upload_port = 192.168.1.184
upload_flags = "--host_port=3232 --timeout=30"

lib_deps = 
	jgromes/RadioLib@7.8.1
	knolleary/PubSubClient@2.8
	; Heltec 2.x nécessite une migration de la configuration carte/LoRaWAN.
	heltecautomation/Heltec ESP32 Dev-Boards@1.1.2
	paulstoffregen/OneWire@2.3.8
	milesburton/DallasTemperature@4.0.6
	paulstoffregen/Time@1.6.1
	bblanchon/ArduinoJson@7.4.3

extra_scripts =
	; Écrit la version du firmware OpenFrisquetVisio dans src/Version.h.
	pre:tools/version.py
	; Génère les pages du portail, qui affichent cette version.
	pre:tools/generate_web_assets.py
