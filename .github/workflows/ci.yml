name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# GitHub donne au workflow un token d’accès au repo qui,
# selon les réglages du repo, peut modifier le code.
# Les tests et compilations restent en lecture seule. Seul le job de publication
# reçoit le droit d'écrire pour créer une Release après validation de main.
permissions:
  contents: read

jobs:
  version:
    name: Version des firmwares
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Définir une version commune aux quatre cartes
        id: version
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          version = datetime.now(ZoneInfo('Europe/Paris')).strftime('%y.%m.%d.%H%M')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              print(f'version={version}', file=output)
          PY

  tests:
    name: Tests Python et Node
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('platformio.ini') }} # cache tant que platformio.ini ne change pas
      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: PlatformIO
        run: pip install platformio==6.2.0
      # Le test SX1276 utilise les en-têtes RadioLib présents dans .pio/libdeps.
      - name: Dépendances pour les tests Python
        run: pio pkg install -e heltec_wifi_lora_32_V3
      - name: Tests Node
        run: node --test tests/*.test.mjs
      - name: Tests Python
        run: for test in tests/test_*.py; do python3 "$test"; done

  firmware:
    name: Compilation ${{ matrix.board }}
    needs: version
    runs-on: ubuntu-24.04
    env:
      OPENFRISQUETVISIO_VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: Heltec V3
            environment: heltec_wifi_lora_32_V3
          - board: Heltec V4
            environment: heltec_wifi_lora_32_V4
          - board: Heltec V4.3
            environment: heltec_wifi_lora_32_V4_3
          - board: LilyGo LoRa32 V2.1
            environment: ttgo_lora32_v21
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('platformio.ini') }}
      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: PlatformIO
        run: pip install platformio==6.2.0
      - name: Compilation ${{ matrix.board }}
        run: pio run -e ${{ matrix.environment }}
      - name: Préparer le binaire pour la Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PIO_ENVIRONMENT: ${{ matrix.environment }}
        run: |
          mkdir -p release
          cp ".pio/build/$PIO_ENVIRONMENT/firmware.bin" "release/firmware-$PIO_ENVIRONMENT.bin"
      # Stockage intermédiaire pour le job release, limité aux builds main.
      - name: Transférer le binaire au job de publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.environment }}
          path: release/*.bin
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publication des firmwares
    needs: [tests, firmware, version]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Récupérer les quatre binaires validés
        uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          path: firmware
          merge-multiple: true
      - name: Vérifier les binaires et calculer leurs sommes SHA-256
        working-directory: firmware
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          environments = (
              'heltec_wifi_lora_32_V3', 'heltec_wifi_lora_32_V4',
              'heltec_wifi_lora_32_V4_3', 'ttgo_lora32_v21',
          )
          checksums = []
          for environment in environments:
              binary = Path(f'firmware-{environment}.bin')
              if not binary.is_file() or binary.stat().st_size == 0:
                  raise SystemExit(f'Binaire manquant ou vide : {binary}')
              checksums.append(f'{hashlib.sha256(binary.read_bytes()).hexdigest()}  {binary.name}\n')
          Path('SHA256SUMS').write_text(''.join(checksums), encoding='utf-8')
          PY
      - name: Publier dans GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FIRMWARE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          release_tag="$FIRMWARE_VERSION"
          latest=false
          current_main=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [ "$current_main" = "$GITHUB_SHA" ]; then
            latest=true
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Version $FIRMWARE_VERSION, compilée depuis main, commit $GITHUB_SHA.
          Tests Python et Node et compilations des quatre cartes réussis.

          Exécution CI : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Télécharger le fichier firmware-<environnement>.bin correspondant à la carte.
          Ces fichiers sont destinés aux mises à jour applicatives (OTA).
          Un premier flash USB nécessite aussi le bootloader et la table de partitions ;
          les fichiers firmware.bin seuls ne les contiennent pas.
          SHA256SUMS permet de vérifier l'intégrité des quatre binaires.
          EOF
          gh release create "$release_tag" firmware/*.bin firmware/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "$FIRMWARE_VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest="$latest"
