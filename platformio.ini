; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; For first installation, remove below line
; - upload_protocol = espota
; and replace IP adress with COM3
; - upload_port = 192.168.1.185


[env:heltec_wifi_lora_32_V3]
board = heltec_wifi_lora_32_V3

[env:heltec_wifi_lora_32_V4]
board = heltec_wifi_lora_32_V4

; TTGO / LilyGO LoRa32 V2.1 (ESP32 + SX1276).
; Premier flash en USB (port auto-détecté, ou --upload-port), ensuite OTA possible.
[env:ttgo_lora32_v21]
board = ttgo-lora32-v21
board_build.partitions = min_spiffs.csv
build_flags = -DBOARD_TTGO_LORA32
upload_protocol = esptool
upload_port =
upload_flags =
upload_speed = 115200
lib_deps =
	jgromes/RadioLib@^6.6.0
	knolleary/PubSubClient@^2.8
	paulstoffregen/OneWire@^2.3.8
	milesburton/DallasTemperature@^3.11.0
	paulstoffregen/Time@^1.6.1
	bblanchon/ArduinoJson

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
#upload_port = /dev/cu.usbserial-0001
#monitor_port = /dev/cu.usbserial-0001
upload_protocol = espota
upload_port = 192.168.1.184
upload_flags = "--host_port=3232"

lib_deps = 
	jgromes/RadioLib@^6.6.0
	knolleary/PubSubClient@^2.8
	heltecautomation/Heltec ESP32 Dev-Boards@^1.1.2
  	paulstoffregen/OneWire@^2.3.8
  	milesburton/DallasTemperature@^3.11.0
  	paulstoffregen/Time@^1.6.1
	bblanchon/ArduinoJson

#extra_scripts = pre:tools/version.py
