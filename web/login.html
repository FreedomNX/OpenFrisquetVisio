<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OpenFrisquetVisio – Connexion</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6fa;color:#172033;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding:24px}
    main{width:min(420px,100%);background:#fff;border:1px solid #dce3ec;border-radius:20px;padding:32px;box-shadow:0 12px 32px rgba(31,48,75,.08)}h1{margin:0;color:#07305f;font-size:25px}p{color:#687386}label{display:block;font-weight:700;margin-bottom:8px}input,button{font:inherit;width:100%;min-height:44px;border-radius:11px;padding:10px 12px}input{border:1px solid #cbd4df}input:focus{outline:3px solid rgba(7,152,223,.18);border-color:#0798df}button{margin-top:18px;border:0;background:#07305f;color:#fff;font-weight:750;cursor:pointer}.error{color:#b42318;margin:14px 0 0}.error:empty{display:none}
  </style>
  <link rel="stylesheet" href="/theme.css">
  <script src="/theme.js"></script>
</head>
<body class="login">
  <main>
    <h1>OpenFrisquetVisio</h1>
    <p>Saisissez votre mot de passe pour accéder au portail.</p>
    <form action="/login" method="post">
      <label for="password">Mot de passe</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="64" required autofocus>
      <p class="error" role="alert">{{LOGIN_ERROR}}</p>
      <button type="submit">Se connecter</button>
    </form>
  </main>
</body>
</html>
